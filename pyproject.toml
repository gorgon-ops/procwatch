[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procwatch"
version = "1.0.0"
description = "A process watchdog: heartbeat-based hang detection, resource limits, and automatic restarts for multi-process pipelines."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Stefan Oanea" }]
keywords = ["watchdog", "supervisor", "monitoring", "heartbeat", "hang-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.2", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
procwatch = "procwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/procwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplification
    "RUF",       # ruff-specific
    "PTH",       # prefer pathlib
    "C4",        # comprehensions
    "TID",       # tidy imports
]
ignore = [
    "E501",    # line length is the formatter's business, not the linter's
    "SIM105",  # contextlib.suppress is not clearer in tight except/pass loops
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reach into internals and import lazily inside functions.
"tests/*" = ["B011", "PTH", "SIM117"]
# The prototypes are kept verbatim as a record; they are not maintained.
"legacy/*" = ["ALL"]

[tool.mypy]
python_version = "3.11"
files = ["src/procwatch"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# psutil ships no stubs in every environment.
module = ["psutil.*"]
ignore_missing_imports = true
